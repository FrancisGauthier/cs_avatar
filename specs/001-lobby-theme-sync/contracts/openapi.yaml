openapi: 3.1.0
info:
  title: cs_avatar Lobby Theme Sync API
  version: 1.0.0
  description: |
    Same-origin HTTP contract for Steam-authenticated lobby roster coordination.
    Steam web sign-in uses OpenID 2.0; this is not an OAuth/OIDC token API.
servers:
  - url: https://cs-avatar.example
    description: Production same-origin API
security:
  - sessionCookie: []
paths:
  /api/v1/auth/steam/login:
    get:
      security: []
      summary: Begin Steam OpenID 2.0 sign-in
      responses:
        "302":
          description: Redirects the browser to the configured Steam OpenID provider.
  /api/v1/auth/steam/callback:
    get:
      security: []
      summary: Validate Steam OpenID assertion and establish a session
      description: |
        Accepts the OpenID 2.0 response parameters from Steam. The server MUST
        validate the assertion, return URL, nonce, provider endpoint, and
        signature before creating the session; client-supplied Steam IDs are
        never accepted as proof of identity.
      responses:
        "302":
          description: Redirects to the SPA after establishing the session.
        "400":
          description: Invalid or mismatched OpenID response.
  /api/v1/auth/session:
    get:
      summary: Return the current authenticated Steam identity
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                type: object
                required: [steamId]
                properties:
                  steamId:
                    $ref: "#/components/schemas/SteamId"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session and close its WebSockets
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfRejected"
  /api/v1/themes:
    get:
      security: []
      summary: List curated themes and their available names/avatar asset IDs
      responses:
        "200":
          description: Curated, read-only theme catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Theme"
  /api/v1/rosters:
    post:
      summary: Create a private roster as the authenticated Steam user
      description: Returns the invitation URL once; its token is in the URL fragment and must not be logged.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [themeId]
              properties:
                themeId:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "201":
          description: Roster created.
          content:
            application/json:
              schema:
                type: object
                required: [roster, invitationUrl]
                properties:
                  roster:
                    $ref: "#/components/schemas/Roster"
                  invitationUrl:
                    type: string
                    format: uri
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/rosters/{rosterId}:
    parameters:
      - $ref: "#/components/parameters/RosterId"
    get:
      summary: Read the roster for an authorized member
      responses:
        "200":
          description: Current authorized roster snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roster"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Close a roster (host only)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Roster closed and its data deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/rosters/join-requests:
    post:
      summary: Request entry using an invitation token
      description: The SPA submits the token in the request body after Steam sign-in; request bodies containing tokens are redacted from logs.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitationToken]
              properties:
                invitationToken:
                  type: string
                  minLength: 32
                  maxLength: 128
      responses:
        "201":
          description: Join request created and awaiting host approval.
          content:
            application/json:
              schema:
                type: object
                required: [requestId, status]
                properties:
                  requestId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    const: PENDING
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/rosters/{rosterId}/join-requests:
    parameters:
      - $ref: "#/components/parameters/RosterId"
    get:
      summary: List pending requests (host only)
      responses:
        "200":
          description: Pending join requests for the host.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [requestId, steamId, requestedAt]
                  properties:
                    requestId:
                      type: string
                      format: uuid
                    steamId:
                      $ref: "#/components/schemas/SteamId"
                    requestedAt:
                      type: string
                      format: date-time
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/rosters/{rosterId}/join-requests/{requestId}/decision:
    parameters:
      - $ref: "#/components/parameters/RosterId"
      - $ref: "#/components/parameters/RequestIdPath"
    post:
      summary: Approve or reject a join request (host only)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
      responses:
        "204":
          description: Request decision applied.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/rosters/{rosterId}/members/{memberId}/assignment:
    parameters:
      - $ref: "#/components/parameters/RosterId"
      - $ref: "#/components/parameters/MemberIdPath"
    put:
      summary: Set a member's name and theme avatar (self or host)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, avatarAssetId]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Server trims and Unicode-normalizes; final limit is 1-32 grapheme clusters with no controls.
                avatarAssetId:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "200":
          description: Assignment saved; ready resets to false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/v1/rosters/{rosterId}/members/{memberId}/ready:
    parameters:
      - $ref: "#/components/parameters/RosterId"
      - $ref: "#/components/parameters/MemberIdPath"
    put:
      summary: Set the member's readiness (self only)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ready]
              properties:
                ready:
                  type: boolean
      responses:
        "204":
          description: Readiness updated.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/rosters/{rosterId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/RosterId"
      - $ref: "#/components/parameters/MemberIdPath"
    delete:
      summary: Remove a member (host) or leave the roster (self)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Membership removed.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/rosters/{rosterId}/invitation/revoke:
    parameters:
      - $ref: "#/components/parameters/RosterId"
    post:
      summary: Revoke the current invitation (host only)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Invitation revoked.
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cs_avatar_session
  parameters:
    RosterId:
      name: rosterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberIdPath:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  schemas:
    SteamId:
      type: string
      pattern: "^[0-9]{17}$"
    Theme:
      type: object
      required: [id, label, nameOptions, avatarAssetIds]
      properties:
        id:
          type: string
        label:
          type: string
        nameOptions:
          type: array
          minItems: 10
          items:
            type: string
        avatarAssetIds:
          type: array
          minItems: 10
          items:
            type: string
    Assignment:
      type: object
      required: [displayName, avatarAssetId, ready]
      properties:
        displayName:
          type: string
        avatarAssetId:
          type: string
        ready:
          type: boolean
    Roster:
      type: object
      required: [id, themeId, status, version, members]
      properties:
        id:
          type: string
          format: uuid
        themeId:
          type: string
        status:
          type: string
          enum: [OPEN, CLOSED, EXPIRED]
        version:
          type: integer
          minimum: 1
        members:
          type: array
          maxItems: 10
          items:
            type: object
            required: [memberId, role, status, ready]
            properties:
              memberId:
                type: string
                format: uuid
              role:
                type: string
                enum: [HOST, PARTICIPANT]
              status:
                type: string
                enum: [APPROVED]
              displayName:
                type: [string, "null"]
              avatarAssetId:
                type: [string, "null"]
              ready:
                type: boolean
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    Unauthorized:
      description: Valid Steam-backed application session required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist or is not visible to this identity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Name, membership limit, roster state, or invitation conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidInput:
      description: Request failed server-side validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CsrfRejected:
      description: CSRF token or request origin invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
